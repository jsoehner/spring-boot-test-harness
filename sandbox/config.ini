# Sandbox Configuration
# Target Environment: WSL2 Fedora 43

# Isolation Type: Firecracker (Preferred) / Kata Containers (Fallback)

[firecracker]
enabled = true
vm_name = harness-target-app
memory = 2048
cpus = 2
rootfs = /usr/local/bin/rootfs.img
network_interface = eth0
port_mappings = 8080:8080

[kata]
enabled = false
runtime_type = firecracker
vm_type = firecracker
memory = 2048
cpus = 2
